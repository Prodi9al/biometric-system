# Security configuration for Apache
ServerTokens Prod
ServerSignature Off

# Disable directory listing
<Directory />
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

# Hide PHP version
Header unset X-Powered-By

# Content Security Policy
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ngrok-free.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Prevent MIME type sniffing
Header always set X-Content-Type-Options nosniff

# Prevent clickjacking
Header always set X-Frame-Options DENY

# XSS Protection
Header always set X-XSS-Protection "1; mode=block"

# Referrer Policy
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Permissions Policy
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

# HSTS (uncomment when using HTTPS)
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

# Disable TRACE method
TraceEnable Off

# Limit request size
LimitRequestBody 10485760

# Timeout
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5